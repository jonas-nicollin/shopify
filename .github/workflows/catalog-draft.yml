name: Installer le catalogue sur le brouillon
on:
  workflow_dispatch:
  push:
    branches: [deploy/catalog-draft]
    paths:
      - 'components/editorial-catalog/**'
permissions:
  contents: read
concurrency:
  group: catalog-draft-install
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/catalog-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @shopify/cli@4.9.1
      - name: Installer les quatre fichiers sur Aglagla V2.0
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_CLI_NO_ANALYTICS: '1'
        run: |
          test -n "$SHOPIFY_CLI_THEME_TOKEN" || { echo "Ajouter le secret SHOPIFY_CLI_THEME_TOKEN dans les réglages Actions."; exit 1; }
          python3 components/editorial-catalog/pilot.py b16e7e-a1.myshopify.com 210635620620 collection.json --install
